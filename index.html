<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>育苗ハウス 1号棟 VR — 潅水シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(255,251,238,.95); --edge:#e6d6b0; --ink:#5a4535; --ink-soft:#8c7560;
  --leaf:#7cc45f; --leaf-deep:#4d9a3b; --water-deep:#2c85c2;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --panel:rgba(56,49,42,.94); --edge:#6b5c4a; --ink:#f5ebd7; --ink-soft:#cdbb9f; } }
:root[data-theme="dark"]{ --panel:rgba(56,49,42,.94); --edge:#6b5c4a; --ink:#f5ebd7; --ink-soft:#cdbb9f; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;background:#9fd6f2;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none}
body{height:100%}
*,*::before,*::after{box-sizing:border-box}
#stage{position:fixed;inset:0}
#stage canvas{display:block;cursor:crosshair;touch-action:none}
#gate{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;
  width:min(560px,calc(100% - 24px));background:var(--panel);border:3px solid var(--edge);border-radius:22px;padding:12px 14px;
  display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:0 4px 0 rgba(150,118,72,.25),0 10px 22px rgba(60,40,20,.16)}
#vrBtn{font-family:inherit;font-weight:800;font-size:18px;border:0;border-radius:16px;padding:14px 18px;background:var(--leaf);color:#fff;cursor:pointer;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
#vrBtn:disabled{background:#c9c0ad;cursor:not-allowed}
#vrBtn:focus-visible{outline:3px solid var(--water-deep);outline-offset:2px}
#gateMsg{font-size:13px;font-weight:700;line-height:1.5;color:var(--ink-soft)}
#keys{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;font-size:12px;font-weight:700;color:#3d5a6b;
  background:rgba(255,255,255,.55);border-radius:10px;padding:5px 9px;max-width:calc(100% - 24px)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="keys">PCプレビュー：左ドラッグで散水／右ドラッグ・矢印で視点／WASDで移動／1・2・3ノズル／V水分ビュー／F速さ／E設定</div>
<div id="gate"><button id="vrBtn" disabled>🥽 VRで遊ぶ</button><div id="gateMsg">VR対応を確認しています…</div></div>

<script src="three.min.js" onerror="this.remove()"></script>
<script>if(!window.THREE)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
(function(){
'use strict';
if(!window.THREE){document.body.innerHTML='<p style="padding:2em;font-family:sans-serif">3Dライブラリを読み込めませんでした。ページを再読み込みしてください。</p>';return;}
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

/* ================= 定数 ================= */
const CELL=0.3,NX=10,NZ=6,LANES=2,BPL=4,GAP=0.22,BENCH_Y=0.78;
const BL=NX*CELL,BW=NZ*CELL,NB=LANES*BPL,PER=NX*NZ,N=NB*PER;
const LANE_Z=[-1.62,1.62];
const SOIL_TOP=BENCH_Y+0.105;
const DAYS=20,PHASE2_DAY=7;   // 仕様書：本葉展開期はDay7〜
const GH={x:8.4,z:3.6,eave:2.3,ridge:3.7};
const REACH=5.4;
const GR=1.25/(DAYS*540);
/* 給水モデル（仕様書 §7 準拠）
   rate[0-100/秒] = L/min × FLOW_CONST ÷ 半径²(格子単位)。本作の含水量は0〜1なので÷100。
   格子1単位 = 0.124m として、フラット半径5 → 0.62m に対応させる。 */
const FLOW_CONST=8.265625,GRID_M=0.124,FALLOFF_K=0.2,SOAK_T=0.1,SOAK_DELAY=3,SOAK_DRY=0.10;
const TOOLS={
  big:{name:'ビッグ',gr:6,min:40,max:70,def:70,color:0xbfe9ff,pps:1100,spread:.85,ico:'💦',msg:'💦 ビッグ：いちばん広い。境界ではにじみに注意'},
  flat:{name:'フラット',gr:5,min:20,max:35,def:30,color:0xffffff,pps:900,spread:.85,ico:'🚿',msg:'🚿 フラット：広さと水量のバランス型'},
  straight:{name:'ストレート',gr:2,min:5,max:20,def:6,color:0xffe27a,pps:420,spread:.7,ico:'💧',msg:'💧 ストレート：狭く、端や境界の仕上げ用'}
};
const TOOL_ORDER=['big','flat','straight'];
for(const k in TOOLS)TOOLS[k].r=TOOLS[k].gr*GRID_M;
const LPM={};for(const k in TOOLS)LPM[k]=TOOLS[k].def;
try{const sv=JSON.parse(localStorage.getItem('ikubyo_lpm')||'{}');for(const k in sv)if(TOOLS[k])LPM[k]=clamp(+sv[k],TOOLS[k].min,TOOLS[k].max);}catch(e){}
const toolRate=k=>LPM[k]*FLOW_CONST/(TOOLS[k].gr*TOOLS[k].gr)/100;
const BANDS=[
  {name:'発芽期',low:.35,high:.85,wilt:.14},
  {name:'本葉期',low:.45,high:.72,wilt:.25}
];
/* ---- 時間システム（仕様書 §5） ----
   8:00〜17:00 を1本の連続した時計で進める。実時間30秒 = ゲーム内1時間。 */
const DAY_START=480,DAY_END=1020,HOUR_SEC=30,GMIN_PER_SEC=60/HOUR_SEC;
const SPEEDS=[{m:1,sym:'▷',name:'通常'},{m:15,sym:'→',name:'早送り'},{m:40,sym:'→→',name:'もっと早送り'}];
const LUNCH_MIN_SPEED=15;           // 昼休憩は操作不可・自動経過（最低でも×15で進める）
const SEGS=[
  {from:480,to:540,label:'朝の潅水',kind:'water'},
  {from:540,to:720,label:'朝の続き',kind:'free'},
  {from:720,to:780,label:'昼休憩',kind:'lunch'},
  {from:780,to:840,label:'昼の潅水',kind:'water'},
  {from:840,to:960,label:'午後の管理',kind:'free'},
  {from:960,to:1020,label:'夕方の潅水',kind:'water'}
];
const segAt=c=>SEGS.find(g=>c>=g.from&&c<g.to)||SEGS[SEGS.length-1];
/* ---- 蒸散（仕様書 §4） ---- */
const HOUR_MULT=[.35,.47,.76,1.10,1.32,1.32,1.10,.76,.47];   // 8〜16時
const SHADE_MULT=.35;
const EVAP_BASE=[.10,.20];          // 含水量(0-100)/秒・等倍時
const NIGHT_DECAY=[5,10];           // 夜間の固定減衰(0-100)
const SKY_MULT={open:1.25,close:.82};
const WX_EVAP={sun:1,cloud:.8,rain:.6};   // 本作独自：天気による補正
const DEATH_MIN=240;                // 含水量0が4時間続くと枯死
const START=new Date(2026,8,1);
const WD='日月火水木金土';
const WX={sun:{icon:'☀️',name:'晴れ',f:1,t:2},cloud:{icon:'⛅',name:'くもり',f:.6,t:0},rain:{icon:'🌧️',name:'雨',f:.35,t:-2}};

/* ================= セルデータ ================= */
const M=new Float32Array(N),G=new Float32Array(N),DRY=new Float32Array(N),ROT=new Float32Array(N),
      STR=new Float32Array(N),BURN=new Float32Array(N),VAR=new Float32Array(N),IB=new Float32Array(N),RY=new Float32Array(N),
      PX=new Float32Array(N),PZ=new Float32Array(N);
const DW=new Float32Array(N),LOCK=new Float32Array(N),SCHK=new Uint8Array(N);
const DM=new Float32Array(N),ZT=new Float32Array(N);
const EDGE=new Uint8Array(N),BEN=new Uint8Array(N),WLT=new Uint8Array(N),OVR=new Uint8Array(N),DRYT=new Uint8Array(N);
const benches=[];
for(let l=0;l<LANES;l++)for(let i=0;i<BPL;i++)benches.push({x:(i-(BPL-1)/2)*(BL+GAP),z:LANE_Z[l],label:'AB'[l]+'-'+(i+1)});
{let k=0;for(let b=0;b<NB;b++){const B=benches[b];for(let cz=0;cz<NZ;cz++)for(let cx=0;cx<NX;cx++){
  PX[k]=B.x-BL/2+CELL*(cx+.5);PZ[k]=B.z-BW/2+CELL*(cz+.5);
  EDGE[k]=(cx===0||cx===NX-1||cz===0||cz===NZ-1)?1:0;BEN[k]=b;
  // 位置による乾きやすさ（仕様書 §4-3）：レーン内で隣のベンチに面する辺＝通路、それ以外の辺＝外周
  const bi=b%BPL,gapAdj=(cx===0&&bi>0)||(cx===NX-1&&bi<BPL-1);
  const outer=(cx===0&&bi===0)+(cx===NX-1&&bi===BPL-1)+(cz===0)+(cz===NZ-1);
  const second=(cx===1&&bi===0)||(cx===NX-2&&bi===BPL-1)||cz===1||cz===NZ-2;
  DM[k]=gapAdj?.8:outer>=2?1.6:outer===1?1.35:second?1.1:1;
  k++;}}}

const S={};
function resetGame(){
  for(let i=0;i<N;i++){M[i]=rand(.5,.62);G[i]=0;DRY[i]=0;ROT[i]=0;STR[i]=0;BURN[i]=0;VAR[i]=1;ZT[i]=0;IB[i]=0;RY[i]=rand(0,Math.PI*2);WLT[i]=0;OVR[i]=0;DRYT[i]=0;}
  Object.assign(S,{day:1,clock:DAY_START,paused:true,running:false,tool:'flat',vent:false,skyOpen:true,shadeFrom:690,shadeTo:780,spd:0,wateredToday:false,warnT:0,
    checkedTemp:false,view:false,pressing:false,aimOn:false,menuOpen:false,dayMin:0,maxT:0,hotNoShade:0,history:[],weather:[]});
  for(let d=0;d<=DAYS+1;d++){const r=Math.random();S.weather[d]=d<=1?'sun':r<.5?'sun':r<.85?'cloud':'rain';}
}
resetGame();

const curBand=()=>BANDS[S.day>=PHASE2_DAY?1:0];
const phaseIdx=()=>S.day>=PHASE2_DAY?1:0;
const shadeOn=h=>{const m=h*60;return m>=S.shadeFrom&&m<S.shadeTo;};
function hourMult(h){
  if(shadeOn(h)||h>=17)return SHADE_MULT;
  const x=clamp(h-8.5,0,8),i=Math.floor(x),f=x-i;return lerp(HOUR_MULT[i],HOUR_MULT[Math.min(8,i+1)],f);
}
const fmtT=m=>Math.floor(m/60)+':'+String(Math.round(m%60)).padStart(2,'0');
function solar(h){if(h<6.2||h>18.8)return 0;return Math.pow(Math.sin(Math.PI*(h-6.2)/12.6),1.15)*WX[S.weather[S.day]].f;}
function tempAt(h){const s=solar(h);return 12+WX[S.weather[S.day]].t+19*s*(shadeOn(h)?.68:1)-5*(S.skyOpen?1:0)*s-(S.vent?2.2:0);}

/* ================= シミュレーション ================= */
function simStep(dt,clockMin){
  const h=(clockMin/60)%24,s=solar(h),T=tempAt(h),band=curBand(),sh=shadeOn(h);
  // 実効蒸散 = フェーズ基準 × 時間帯倍率 × 位置倍率 × 天窓倍率（×天気補正）
  // EVAP_BASE は「0-100/実秒(等倍)」→ 本作の0-1・ゲーム内1分あたりへ換算
  const loss=EVAP_BASE[phaseIdx()]/100/GMIN_PER_SEC*hourMult(h)*(S.skyOpen?SKY_MULT.open:SKY_MULT.close)*WX_EVAP[S.weather[S.day]];
  const isDay=h>=8&&h<17;
  const gr=isDay?GR*(sh?.88:1)*dt:0;
  const p2=S.day>=PHASE2_DAY;
  if(isDay){S.dayMin+=dt;if(T>S.maxT)S.maxT=T;if(T>30&&!sh)S.hotNoShade+=dt;}
  for(let i=0;i<N;i++){
    if(DRY[i]>=1||ROT[i]>=1)continue;             // 枯死マスは含水量も固定
    let m=M[i]-loss*DM[i]*dt;if(m<0)m=0;M[i]=m;
    if(m<=0){ZT[i]+=dt;if(ZT[i]>=DEATH_MIN){DRY[i]=1;continue;}}else ZT[i]=0;
    if(m<band.wilt){DRY[i]+=.0032*dt*(1+(band.wilt-m)*5);WLT[i]=1;}
    if(m>=band.low){
      if(m<=band.high){G[i]+=gr;if(isDay)IB[i]+=dt;}
      else{
        G[i]+=gr*.9;OVR[i]=1;
        if(p2)STR[i]+=(m-band.high)*.014*dt*(S.vent?.6:1)*(sh?1.25:1);
        else{STR[i]+=(m-band.high)*.004*dt;if(m>.95)ROT[i]+=(m-.95)*.05*dt*(S.vent?.6:1);}
      }
    }else{
      G[i]+=gr*.75*clamp((m-band.wilt)/(band.low-band.wilt),0,1);DRYT[i]=1;
      if(isDay&&T>30&&s>.45&&!sh)BURN[i]+=.0028*dt*(T-30)/4*(p2?1:.5);
    }
  }
}
function simulate(total,from){const st=2;for(let t=0;t<total;t+=st){const d=Math.min(st,total-t);simStep(d,from+t+d/2);}}

/* ================= three.js（VR対応） ================= */
const EYE=1.7;                       // PCプレビュー時の目線。VRでは実際の頭の高さ
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
if(renderer.xr.setFoveation)renderer.xr.setFoveation(1);   // Quest：視野の周辺を粗く描いて負荷を下げる
$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#9fd6f2');
scene.fog=new THREE.Fog('#9fd6f2',28,90);
/* rig = プレイヤーの立ち位置。VRでは頭とコントローラーがこの子になり、スティック移動・スナップ回転はrigを動かす */
const rig=new THREE.Group();scene.add(rig);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,200);
camera.rotation.order='YXZ';camera.position.set(0,EYE,0);
rig.add(camera);
const hemi=new THREE.HemisphereLight(0xe6f6ff,0xb9a78a,.78);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,.8);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:60});
sun.shadow.bias=-.0006;scene.add(sun);scene.add(sun.target);

const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0,flatShading:true},o||{}));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function add(geo,m,x,y,z,opt){const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);if(opt&&opt.cast)me.castShadow=true;if(!opt||opt.recv!==false)me.receiveShadow=true;scene.add(me);return me;}
function beam(a,b,r,m,seg){const d=new THREE.Vector3().subVectors(b,a),len=d.length();const me=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||6),m);me.position.copy(a).addScaledVector(d,.5);me.quaternion.setFromUnitVectors(V3(0,1,0),d.normalize());me.castShadow=true;scene.add(me);return me;}

/* --- 外の景色 --- */
add(new THREE.PlaneGeometry(240,240).rotateX(-Math.PI/2),mat('#a9d673'),0,-.02,0);
for(let i=0;i<9;i++){const a=i/9*Math.PI*2+rand(-.2,.2),r=rand(55,75);
  const h=add(new THREE.IcosahedronGeometry(rand(10,18),1),mat(['#8cc865','#7dbb5a','#9ad172'][i%3]),Math.cos(a)*r,-3,Math.sin(a)*r);h.scale.y=.45;}
function tree(x,z){const s=rand(.8,1.4);add(new THREE.CylinderGeometry(.14*s,.2*s,1.2*s,5),mat('#9a6b45'),x,.6*s,z,{cast:true});
  const c=['#5fae4e','#6fbd52','#4f9e48'][Math.floor(Math.random()*3)];
  if(Math.random()<.5){add(new THREE.ConeGeometry(1.1*s,1.8*s,6),mat(c),x,1.9*s,z,{cast:true});add(new THREE.ConeGeometry(.8*s,1.4*s,6),mat(c),x,2.7*s,z,{cast:true});}
  else add(new THREE.IcosahedronGeometry(1.1*s,0),mat(c),x,2.1*s,z,{cast:true});}
for(let i=0;i<46;i++){let x,z;do{x=rand(-40,40);z=rand(-30,30);}while(Math.abs(x)<12&&Math.abs(z)<8);tree(x,z);}
const clouds=[];for(let i=0;i<10;i++){const g=new THREE.Group();for(let j=0;j<3;j++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.5,2.6),0),mat('#ffffff',{roughness:1}));m.position.set(j*2-2,rand(-.3,.3),rand(-.6,.6));m.scale.y=.6;g.add(m);}g.position.set(rand(-60,60),rand(16,24),rand(-50,50));scene.add(g);clouds.push(g);}

/* --- ハウス --- */
add(new THREE.PlaneGeometry(GH.x*2,GH.z*2).rotateX(-Math.PI/2),mat('#d8d0c0'),0,0,0);
for(const z of LANE_Z)add(new THREE.PlaneGeometry(GH.x*2-.6,BW+.9).rotateX(-Math.PI/2),mat('#77736b'),0,.005,z);
const frameM=mat('#eef2f6',{roughness:.5});
const prof=[];for(let k=0;k<=10;k++){const t=k/10*Math.PI;prof.push([-GH.z*Math.cos(t),GH.eave+(GH.ridge-GH.eave)*Math.sin(t)]);}
for(let x=-GH.x;x<=GH.x+.01;x+=2.1){
  beam(V3(x,0,-GH.z),V3(x,GH.eave,-GH.z),.045,frameM);beam(V3(x,0,GH.z),V3(x,GH.eave,GH.z),.045,frameM);
  for(let k=0;k<10;k++)beam(V3(x,prof[k][1],prof[k][0]),V3(x,prof[k+1][1],prof[k+1][0]),.04,frameM);
  beam(V3(x,GH.eave,-GH.z),V3(x,GH.eave,GH.z),.025,frameM);
}
for(const k of[0,3,5,7,10])beam(V3(-GH.x,prof[k][1],prof[k][0]),V3(GH.x,prof[k][1],prof[k][0]),.03,frameM);
for(const z of[-GH.z,GH.z])beam(V3(-GH.x,1.1,z),V3(GH.x,1.1,z),.03,frameM);
const glass=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.13,side:THREE.DoubleSide,depthWrite:false,roughness:.2});
{const pos=[],idx=[];prof.forEach((p,k)=>{pos.push(-GH.x,p[1],p[0],GH.x,p[1],p[0]);if(k<10){const a=k*2;idx.push(a,a+1,a+3,a,a+3,a+2);}});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,glass));}
for(const z of[-GH.z,GH.z]){const m=new THREE.Mesh(new THREE.PlaneGeometry(GH.x*2,GH.eave),glass);m.position.set(0,GH.eave/2,z);scene.add(m);}
{const sh=new THREE.Shape();sh.moveTo(-GH.z,0);prof.forEach(p=>sh.lineTo(p[0],p[1]));sh.lineTo(GH.z,0);
 for(const x of[-GH.x,GH.x]){const m=new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateY(Math.PI/2),glass);m.position.x=x;scene.add(m);}}
// 天窓
const skyPanels=[];
for(const side of[1,-1]){const g=new THREE.Group();g.position.set(0,GH.ridge+.03,0);
  const p=new THREE.Mesh(new THREE.BoxGeometry(GH.x*2-.4,.025,.85).translate(0,0,side*.425),new THREE.MeshStandardMaterial({color:0xdff3ff,transparent:true,opacity:.45,roughness:.2}));
  g.add(p);scene.add(g);skyPanels.push({g,side,cur:0});}
// 遮光カーテン
const curtain=new THREE.Mesh(new THREE.PlaneGeometry(GH.x*2,GH.z*2-.1).rotateX(Math.PI/2).translate(GH.x,0,0),
  new THREE.MeshStandardMaterial({color:0xf6f1e2,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false,roughness:1}));
curtain.position.set(-GH.x,GH.eave-.06,0);curtain.scale.x=.02;scene.add(curtain);
// 換気扇
const fans=[];
for(const z of[-1.8,1.8]){add(new THREE.BoxGeometry(.14,1,1),mat('#cfd7df',{roughness:.5}),GH.x-.08,1.75,z,{cast:true});
  const g=new THREE.Group();g.position.set(GH.x-.18,1.75,z);
  for(let k=0;k<4;k++){const b=new THREE.Mesh(new THREE.BoxGeometry(.03,.4,.12).translate(0,.2,0),mat('#8fa1b3'));b.rotation.x=k*Math.PI/2;g.add(b);}

function todoCounts(){
  const band=curBand();const bIn=new Array(NB).fill(0),eIn=new Array(NB).fill(0),eTot=new Array(NB).fill(0);let inb=0,health=0;
  for(let i=0;i<N;i++){const m=M[i],ok=m>=band.low&&m<=band.high,b=BEN[i];if(ok){inb++;bIn[b]++;}if(EDGE[i]){eTot[b]++;if(ok)eIn[b]++;}
    health+=(DRY[i]>=1||ROT[i]>=1)?0:(1-Math.max(DRY[i],ROT[i])*.8)*(1-Math.min(BURN[i],1)*.4)*(1-Math.min(STR[i],1)*.3);}
  let bOk=0,eOk=0;for(let b=0;b<NB;b++){if(bIn[b]/PER>=.85)bOk++;if(eIn[b]/eTot[b]>=.85)eOk++;}
  return{bOk,eOk,wp:Math.round(inb/N*100),hp:Math.round(health/N*100)};
}

  const g=segAt(S.clock);let mult=SPEEDS[S.spd].m;if(g.kind==='lunch')mult=Math.max(mult,LUNCH_MIN_SPEED);
  let to=S.clock+realDt*GMIN_PER_SEC*mult;
  const mk=MARKS.find(m=>S.clock<m&&to>=m);if(mk!==undefined)to=mk;
  simulate(to-S.clock,S.clock);S.clock=to;
  if(mk===720)toast('🍱 昼休憩：12〜13時は自動で進みます（潅水不可）');
  if(mk===780)setSpeed(0,'☀️ 13:00 昼の潅水。等倍に戻しました');
  if(mk===960)toast('🌇 16:00 夕方の潅水。端の仕上げどき');
  if(mk===DAY_END)endDay();
}
function dayStats(){
  let ib=0,alive=0,wilt=0,over=0,edgeDry=0,innerDry=0,eT=0,iT=0;
  for(let i=0;i<N;i++){if(DRY[i]<1&&ROT[i]<1){alive++;ib+=IB[i];}wilt+=WLT[i];over+=OVR[i];
    if(EDGE[i]){eT++;edgeDry+=DRYT[i];}else{iT++;innerDry+=DRYT[i];}}
  return{ib:Math.round(alive&&S.dayMin?ib/alive/S.dayMin*100:0),wilt,over,maxT:Math.round(S.maxT),edgeR:edgeDry/eT,innerR:innerDry/iT,hot:S.hotNoShade};
}
function endDay(){
  S.paused=true;const st=dayStats();S.history.push(st.ib);
  if(S.day>=DAYS){showResults();return;}
  showModal('night',(x)=>{frame(x,1600,1000);txt(x,'🌙 夜間',800,450,{size:80,w:800,a:'center'});
    txt(x,'17:00〜翌8:00　含水量が一定量だけ下がります',800,540,{size:34,w:700,c:COL.soft,a:'center'});});

  setTimeout(()=>{for(let i=0;i<N;i++)if(DRY[i]<1&&ROT[i]<1)M[i]=Math.max(0,M[i]-nd);showDayModal(st);},1100);
}

const keys={};
let hasMouse=false,looking=false,pressing=false,lx=0,ly=0,yaw=-Math.PI/2,pitch=-.35,xrOn=false,xrSession=null;
const pos=V3(-7,0,0);
const cv=renderer.domElement;
function setMouse(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);hasMouse=true;}
function uiMouse(){
  camera.updateMatrixWorld();ray.setFromCamera(mouse,camera);
  const hs=ray.intersectObjects(uiList(),false);if(!hs.length)return null;
  const h=hs[0],p=h.object.userData.panel;return{panel:p,btn:h.uv?p.at(h.uv):null,point:h.point,distance:h.distance};
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(xrOn)return;cv.setPointerCapture(e.pointerId);setMouse(e);
  if(e.button===2||e.button===1||e.shiftKey){looking=true;lx=e.clientX;ly=e.clientY;return;}
  const u=uiMouse();if(u){if(u.btn)u.btn.fn();return;}
  pressing=true;
});
cv.addEventListener('pointermove',e=>{
  if(xrOn)return;
  if(looking){yaw-=(e.clientX-lx)*.004;pitch=clamp(pitch-(e.clientY-ly)*.004,-1.3,.35);lx=e.clientX;ly=e.clientY;}
  setMouse(e);
});
const ptrUp=()=>{looking=false;pressing=false;};
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
cv.addEventListener('pointerleave',()=>{if(!pressing&&!looking)hasMouse=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();if(!xrOn)toggleTool();},{passive:false});
addEventListener('keydown',e=>{
  if(xrOn)return;

  if(modal.mesh.visible&&!S.menuOpen)return;

  if(e.code==='Digit2')setTool('flat');
  if(e.code==='Digit3')setTool('straight');

  if(e.code==='KeyE'||e.code==='Escape'){S.menuOpen?closeMenu():e.code==='KeyE'&&openMenu();}

});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pressing=false;looking=false;});
const dz=v=>Math.abs(v)<.15?0:v;
function walkable(x,z){if(Math.abs(x)>7.7||Math.abs(z)>3.2)return false;return Math.abs(z)<=.5||Math.abs(x)>=6.85;}
function updateMoveDesk(dt){
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const turn=(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0),tilt=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);
  yaw+=turn*1.6*dt;pitch=clamp(pitch+tilt*1.1*dt,-1.3,.35);
  const sp=2.6*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const dx=(fx*f+rx*s)*sp,dzz=(fz*f+rz*s)*sp;
  if(walkable(pos.x+dx,pos.z))pos.x+=dx;if(walkable(pos.x,pos.z+dzz))pos.z+=dzz;
  const moving=Math.abs(f)+Math.abs(s)>.05;
  rig.position.set(pos.x,0,pos.z);rig.rotation.set(0,0,0);
  camera.position.set(0,EYE+Math.sin(performance.now()/260)*(moving?.012:0),0);
  camera.rotation.set(pitch,yaw,0);
}
const qA=new THREE.Quaternion(),aimV=new THREE.Vector3();
function aimDesk(hit,spraying){
  camera.updateMatrixWorld();qA.copy(deskHolder.quaternion);
  if(hit&&hit.ok)deskHolder.lookAt(hit.pt);
  else{camera.getWorldDirection(aimV);camera.getWorldPosition(tmpV);aimV.multiplyScalar(3).add(tmpV);aimV.y-=.8;deskHolder.lookAt(aimV);}
  const qB=deskHolder.quaternion.clone();deskHolder.quaternion.copy(qA).slerp(qB,.25);
  deskHolder.position.set(.24+(spraying?rand(-.002,.002):0),-.27+(spraying?rand(-.002,.002):0),-.32);
}

/* ================= 入力：VR（Meta Quest コントローラー） ================= */
const uiList=()=>[modal.mesh,wrist.mesh].filter(m=>m.visible&&m.parent);
const ctrls=[0,1].map(i=>{
  const r=renderer.xr.getController(i),g=renderer.xr.getControllerGrip(i);rig.add(r);rig.add(g);
  const o={ray:r,grip:g,hand:null,src:null,prev:{},snapReady:true,trigLock:false};
  r.addEventListener('connected',e=>{o.src=e.data;o.hand=e.data.handedness;mountHands();});
  r.addEventListener('disconnected',()=>{o.src=null;o.hand=null;o.prev={};mountHands();});
  return o;});
const hasPad=o=>o.src&&o.src.gamepad;
const rightC=()=>ctrls.find(o=>o.hand==='right'&&hasPad(o));
const leftC=()=>ctrls.find(o=>o.hand==='left'&&hasPad(o));
const held=(o,k)=>{const b=o.src.gamepad.buttons[k];return!!(b&&b.pressed);};
function edge(o,k){const now=held(o,k),was=!!o.prev[k];o.prev[k]=now;return now&&!was;}
function stick(o){const a=o.src.gamepad.axes;return a.length>=4?[a[2],a[3]]:[a[0]||0,a[1]||0];}
function haptic(o,v,ms){const h=o&&hasPad(o)&&o.src.gamepad.hapticActuators;if(h&&h[0]&&h[0].pulse){try{h[0].pulse(v,ms);}catch(e){}}}
function mountHands(){
  if(!xrOn){deskInner.add(nozzle);camera.add(wrist.mesh);wrist.mesh.position.set(-.25,-.19,-.48);wrist.mesh.rotation.set(0,0,0);wrist.mesh.visible=true;if(laser.parent)laser.parent.remove(laser);return;}
  const r=rightC(),l=leftC();
  if(r){r.grip.add(nozzle);r.ray.add(laser);}
  if(l){l.grip.add(wrist.mesh);wrist.mesh.position.set(0,.07,.06);wrist.mesh.rotation.set(-1.05,0,0);wrist.mesh.visible=true;l.grip.add(leftBody);}
  else wrist.mesh.visible=false;
  nozzle.position.set(0,0,0);nozzle.rotation.set(0,0,0);
}
function moveXR(ax,ay,dt){
  if(!ax&&!ay)return;
  camera.getWorldPosition(headW);camera.getWorldDirection(fwd);fwd.y=0;if(fwd.lengthSq()<1e-4)return;fwd.normalize();
  const sp=2*dt,dx=(fwd.x*-ay+-fwd.z*ax)*sp,dzz=(fwd.z*-ay+fwd.x*ax)*sp;
  let hx=headW.x,hz=headW.z;
  if(walkable(hx+dx,hz)||!walkable(hx,hz)){rig.position.x+=dx;hx+=dx;}
  if(walkable(hx,hz+dzz)||!walkable(hx,hz)){rig.position.z+=dzz;}
}
function snapTurn(a){camera.getWorldPosition(headW);rig.position.sub(headW).applyAxisAngle(V3(0,1,0),a).add(headW);rig.rotation.y+=a;}
function menuButton(){if(S.menuOpen)closeMenu();else if(modalMode)placeModal();else openMenu();}
function pollXR(dt){
  const r=rightC(),l=leftC();
  if(l){const[ax,ay]=stick(l);moveXR(dz(ax),dz(ay),dt);if(edge(l,4))cycleSpeed();if(edge(l,5))menuButton();}
  if(r){const[ax]=stick(r);
    if(Math.abs(ax)>.7&&r.snapReady){snapTurn(ax>0?-Math.PI/6:Math.PI/6);r.snapReady=false;}
    if(Math.abs(ax)<.3)r.snapReady=true;
    if(edge(r,4))toggleTool();if(edge(r,5))toggleView();}
}
function uiFromController(o){
  o.ray.updateMatrixWorld(true);tmpV.setFromMatrixPosition(o.ray.matrixWorld);
  dirW.set(0,0,-1).transformDirection(o.ray.matrixWorld);
  ray.set(tmpV,dirW);ray.far=4;const hs=ray.intersectObjects(uiList(),false);ray.far=Infinity;
  if(!hs.length)return null;const h=hs[0],p=h.object.userData.panel;
  return{panel:p,btn:h.uv?p.at(h.uv):null,point:h.point,distance:h.distance,obj:h.object};
}

/* ================= VRセッション ================= */
function setShadows(on){renderer.shadowMap.enabled=on;sun.castShadow=on;
  scene.traverse(o=>{const m=o.material;if(!m)return;(Array.isArray(m)?m:[m]).forEach(q=>q.needsUpdate=true);});}
async function startXR(){
  try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    xrSession=s;s.addEventListener('end',onXREnd);
    await renderer.xr.setSession(s);
    xrOn=true;setShadows(false);                     // Quest向けに影を切って72〜90fpsを確保
    rig.position.set(pos.x,0,pos.z);rig.rotation.set(0,yaw,0);camera.position.set(0,0,0);camera.rotation.set(0,0,0);

function onXREnd(){

  xrOn=false;xrSession=null;
  pos.set(headW.x,0,headW.z);if(!walkable(pos.x,pos.z))pos.set(-7,0,0);

async function initXR(){

/* ================= ループ ================= */
let last=0,frameN=0,hudT=0,idleT=0,hapT=0;
function setHover(panel,key){for(const p of[modal,wrist]){const k=p===panel?key:null;if(p.hover!==k){p.hover=k;p.redraw();}}}
function loop(now){
  const dt=last?Math.min(.05,(now-last)/1000):.016;last=now;frameN++;
  const pnow=performance.now();
  if(needPlace>0&&--needPlace===0&&modal.mesh.visible)placeModal();
  let hit=null,ui=null,wantSpray=false;
  if(xrOn){
    rig.updateMatrixWorld(true);
    pollXR(dt);rig.updateMatrixWorld(true);
    const r=rightC();
    if(r){
      ui=uiFromController(r);
      const trig=edge(r,0),hold=held(r,0);
      if(!hold)r.trigLock=false;
      if(ui){laser.visible=true;laser.scale.z=ui.distance;
        if(trig&&ui.btn){r.trigLock=true;haptic(r,.35,25);ui.btn.fn();}}
      else{laser.visible=false;hit=S.running?pickVR():null;wantSpray=hold&&!r.trigLock;}
    }else laser.visible=false;
  }else{
    if(!S.running){idleT+=dt;yaw=-Math.PI/2+Math.sin(idleT*.15)*.35;}
    updateMoveDesk(dt);scene.updateMatrixWorld();
    if(hasMouse&&!looking)ui=uiMouse();
    if(!ui&&S.running)hit=pickDesk();
    wantSpray=pressing&&!ui;
  }
  setHover(ui&&ui.btn?ui.panel:null,ui&&ui.btn?ui.btn.key:null);
  if(xrOn&&ui){cursor.visible=true;cursor.position.copy(ui.point);ui.obj.getWorldQuaternion(cursor.quaternion);
    tmpV.set(0,0,1).applyQuaternion(cursor.quaternion);cursor.position.addScaledVector(tmpV,.003);}
  else cursor.visible=false;

  const g=segAt(S.clock);
  const canWater=S.running&&!S.paused&&g.kind!=='lunch'&&S.spd===0;
  const wants=wantSpray&&S.running&&!S.paused&&hit&&hit.ok;
  const spraying=!!(wants&&canWater);
  if(spraying){applyWater(hit.pt,dt);emit(hit,dt);S.wateredToday=true;
    if(xrOn){hapT-=dt;if(hapT<=0){hapT=.07;haptic(rightC(),S.tool==='straight'?.07:S.tool==='big'?.2:.13,80);}}}
  else stopWater();
  if(wants&&!canWater&&pnow-S.warnT>2500){S.warnT=pnow;toast(g.kind==='lunch'?'🍱 昼休憩中は潅水できません':'⏩ 早送り中は潅水できません（▷で等倍に）');}
  if(!xrOn)aimDesk(hit,spraying);
  updateDrops(dt);
  if(S.running&&!S.paused)advanceClock(dt);
  if(hit){ring.visible=ringDot.visible=true;ring.position.set(hit.pt.x,SOIL_TOP+.012,hit.pt.z);ringDot.position.copy(ring.position);
    ring.material.color.set(!hit.ok||!canWater?0xb0b0b0:hit.spill?0xffa35c:TOOLS[S.tool].color);ring.material.opacity=hit.ok?.9:.4;}
  else ring.visible=ringDot.visible=false;
  arcLine.visible=!!(xrOn&&hit&&!spraying&&!S.paused);
  if(arcLine.visible)arcLine.material.color.set(hit.ok&&canWater?TOOLS[S.tool].color:0xb0b0b0);
  updateSoil();if(frameN%3===0)updatePlants();
  updateWorld(dt);
  hudT+=dt;if(hudT>.25){hudT=0;wrist.redraw();}
  updateGauge(hit);
  if(toastP.mesh.visible&&pnow>toastUntil)toastP.mesh.visible=false;
  renderer.render(scene,camera);
}
function onResize(){if(renderer.xr.isPresenting)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(modal.mesh.visible)placeModal();}
addEventListener('resize',onResize);

/* ================= 起動 ================= */
mountHands();setTool('flat');applyViewMode();updatePlants();wrist.redraw();
showModal('start',drawStart);
renderer.setAnimationLoop(loop);
})();
</script>
</body>
